services:
  - type: web
    name: interview-copilot-realtime
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack pnpm --filter @meeting-assistant/web... install --frozen-lockfile && npm run build:realtime
    startCommand: npm run start:realtime
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: ALLOWED_ORIGIN
        value: https://interview-copilot-local.netlify.app
